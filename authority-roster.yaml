verifier:
  runId: hercules-legacy-verifier-v1
  implementation: hercules-orchestrator.verifier.v1
evaluator:
  runId: hercules-review-evaluation-v1
  implementationId: hercules-control.reviewEvaluation.v1
  version: c3.3
  model: null
  runtime: node-22
